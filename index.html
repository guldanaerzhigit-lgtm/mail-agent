<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mail Agent — Old School</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="authScreen" class="auth-screen"><div class="login-window"><div class="titlebar">Mail Agent <span>●</span></div><div class="login-body"><div class="logo">@</div><h2>Mail Agent</h2><p class="muted">Старый добрый мессенджер</p><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Пароль"><input id="displayName" type="text" placeholder="Имя (для регистрации)"><div class="buttons"><button id="loginBtn">Войти</button><button id="signupBtn" class="secondary">Регистрация</button></div><button id="googleBtn" class="google">Войти через Google</button><div id="authError" class="error"></div></div></div></div>
<div id="app" class="agent hidden"><header class="topbar"><div class="brand"><b>Mail Agent</b> <span>● online</span></div><div class="top-actions"><button id="statusBtn">🟢 В сети</button><button id="logoutBtn">Выйти</button></div></header>
<main class="layout"><aside class="sidebar"><div class="profile"><div id="myAvatar" class="avatar">A</div><div><b id="myName">Пользователь</b><small id="myEmail"></small></div></div>
<input id="searchUsers" class="search" placeholder="Поиск пользователей..."><div class="section-title">МОИ ДРУЗЬЯ</div><div id="friendsList" class="users"></div>
<div class="section-title requests-title">ЗАЯВКИ <span id="requestCount" class="badge hidden">0</span></div><div id="requestsList" class="requests"></div>
<div class="section-title">ПОЛЬЗОВАТЕЛИ</div><div id="usersList" class="users"></div></aside>
<section class="chat"><div id="emptyChat" class="empty"><div class="big-at">@</div><b>Выберите контакт</b><span>Добавляйте друзей и общайтесь в реальном времени</span></div>
<div id="chatPanel" class="hidden full"><div class="chat-head"><div id="chatAvatar" class="avatar">A</div><div class="chat-title"><b id="chatName">Контакт</b><small id="chatStatus">offline</small></div><button id="friendBtn" class="friend-btn">+ Добавить в друзья</button></div><div id="messages" class="messages"></div><form id="messageForm" class="composer"><button type="button" id="emojiBtn" class="emoji-btn">😀</button><input id="messageInput" autocomplete="off" placeholder="Введите сообщение..."><button type="submit">Отправить</button></form><div id="emojiPanel" class="emoji-panel hidden"></div></div></section></main></div>
<script type="module" src="app.js"></script></body></html>
