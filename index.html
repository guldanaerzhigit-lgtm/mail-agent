<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4d7894"><title>Агент Mail.Ru — Classic</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<div id="authScreen" class="auth-screen"><div class="window auth-window"><div class="titlebar"><span>Агент Mail.Ru</span><span class="window-buttons">_ □ ×</span></div><div class="auth-body"><div class="agent-logo">@</div><h1>Агент</h1><div class="subtitle">Общение с друзьями</div><input id="email" type="email" placeholder="Электронная почта"><input id="password" type="password" placeholder="Пароль"><input id="displayName" type="text" placeholder="Имя при регистрации"><div class="button-row"><button id="loginBtn">Войти</button><button id="signupBtn">Регистрация</button></div><button id="googleBtn" class="google">Войти через Google</button><div id="authError" class="error"></div></div><div class="statusbar">Агент • classic edition</div></div></div>
<div id="app" class="app hidden"><div class="desktop-shell">
<div class="contact-window window"><div class="titlebar"><span><strong>Агент</strong></span><span class="window-buttons">_ □ ×</span></div><div class="accountbar"><div id="myAvatar" class="avatar">A</div><div class="account-info"><b id="myName">Пользователь</b><small id="myEmail"></small></div><button id="statusBtn" class="status-select">● В сети</button></div><div class="menu"><span>Файл</span><span>Контакты</span><span>Настройки</span><span>Помощь</span></div><div class="search-row"><input id="searchUsers" class="search" placeholder="Поиск контакта..."></div><div class="section-title">МОИ КОНТАКТЫ</div><div class="tabs"><button id="tabFriends" class="tab active">Друзья</button><button id="tabUsers" class="tab">Поиск</button><button id="tabRequests" class="tab">Заявки <span id="requestCount" class="badge hidden">0</span></button></div><div id="friendsList" class="users"></div><div id="usersList" class="users hidden"></div><div id="requestsList" class="requests hidden"></div><div class="contact-bottom"><button>Добавить контакт</button><button id="logoutBtn">Выйти</button></div><div class="statusbar">Готово</div></div>
<div class="chat-window window"><div class="titlebar"><span id="windowChatTitle">Агент — Диалог</span><span class="window-buttons">_ □ ×</span></div><div id="emptyChat" class="empty"><div class="empty-logo">@</div><b>Агент</b><span>Выберите контакт для разговора</span></div><div id="chatPanel" class="hidden full"><div class="chat-head"><div id="chatAvatar" class="avatar">A</div><div class="chat-title"><b id="chatName">Контакт</b><small id="chatStatus">не в сети</small><small id="typingIndicator" class="typing hidden">печатает...</small></div><button id="friendBtn" class="friend-btn">Добавить в контакты</button></div><div class="chat-tools"><button>Файл</button><button>Смайлы</button><button>История</button></div><div id="messages" class="messages"></div><div id="uploadProgress" class="upload-progress hidden"></div><form id="messageForm" class="composer"><input id="fileInput" type="file" hidden accept="image/*,.pdf,.txt,.doc,.docx,.zip"><button type="button" id="fileBtn" class="icon-btn">📎</button><button type="button" id="emojiBtn" class="icon-btn">☺</button><input id="messageInput" autocomplete="off" placeholder="Введите сообщение..."><button type="submit">Отправить</button></form><div id="emojiPanel" class="emoji-panel hidden"></div><div class="statusbar">Сообщение • Enter — отправить</div></div></div></div></div><script type="module" src="app.js"></script></body></html>
