<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#35658a">
<title>Mail Agent</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="authScreen" class="auth-screen">
  <div class="window auth-window">
    <div class="titlebar"><span>Mail Agent</span><span class="window-buttons">_ □ ×</span></div>
    <div class="auth-body">
      <div class="agent-logo">@</div>
      <h1>Mail Agent</h1>
      <div class="subtitle">Старый добрый мессенджер</div>
      <input id="email" type="email" placeholder="E-mail">
      <input id="password" type="password" placeholder="Пароль">
      <input id="displayName" type="text" placeholder="Имя при регистрации">
      <div class="button-row"><button id="loginBtn">Войти</button><button id="signupBtn" class="secondary">Регистрация</button></div>
      <button id="googleBtn" class="google">Войти через Google</button>
      <div id="authError" class="error"></div>
    </div>
    <div class="statusbar">Mail Agent • 2000s edition</div>
  </div>
</div>

<div id="app" class="app hidden">
  <div class="window main-window">
    <div class="titlebar">
      <span><strong>Mail Agent</strong> — Мессенджер</span>
      <span class="window-buttons">_ □ ×</span>
    </div>
    <div class="toolbar">
      <button id="statusBtn">🟢 В сети</button>
      <button id="logoutBtn">Выйти</button>
    </div>
    <div class="main-layout">
      <aside class="sidebar">
        <div class="profile">
          <div id="myAvatar" class="avatar">A</div>
          <div class="profile-text"><b id="myName">Пользователь</b><small id="myEmail"></small></div>
        </div>
        <input id="searchUsers" class="search" placeholder="Поиск..."><div class="section-title">КОНТАКТЫ</div>
        <div class="tabs"><button id="tabFriends" class="tab active">Друзья</button><button id="tabUsers" class="tab">Все</button><button id="tabRequests" class="tab">Заявки <span id="requestCount" class="badge hidden">0</span></button></div>
        <div id="friendsList" class="users"></div><div id="usersList" class="users hidden"></div><div id="requestsList" class="requests hidden"></div>
      </aside>
      <section class="chat">
        <div id="emptyChat" class="empty"><div class="empty-logo">@</div><b>Mail Agent</b><span>Выберите контакт слева, чтобы начать разговор</span></div>
        <div id="chatPanel" class="hidden full">
          <div class="chat-head"><div id="chatAvatar" class="avatar">A</div><div class="chat-title"><b id="chatName">Контакт</b><small id="chatStatus">offline</small><small id="typingIndicator" class="typing hidden">печатает...</small></div><button id="friendBtn" class="friend-btn">+ Добавить в друзья</button></div>
          <div id="messages" class="messages"></div><div id="uploadProgress" class="upload-progress hidden"></div>
          <form id="messageForm" class="composer"><input id="fileInput" type="file" hidden accept="image/*,.pdf,.txt,.doc,.docx,.zip"><button type="button" id="fileBtn" class="icon-btn">📎</button><button type="button" id="emojiBtn" class="icon-btn">☺</button><input id="messageInput" autocomplete="off" placeholder="Напишите сообщение..."><button type="submit">Отправить</button></form>
          <div id="emojiPanel" class="emoji-panel hidden"></div>
        </div>
      </section>
    </div>
    <div class="statusbar main-status"><span>Готов</span><span>Mail Agent</span></div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
