<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1683ff"><title>Mail Agent Messenger</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"></head><body>
<div id="authScreen" class="auth-screen"><div class="auth-card"><div class="brand-logo">@</div><h1>Mail Agent</h1><p>Быстрый мессенджер</p><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Пароль"><input id="displayName" placeholder="Имя при регистрации"><div class="auth-actions"><button id="loginBtn">Войти</button><button id="signupBtn" class="secondary">Регистрация</button></div><button id="googleBtn" class="google">Продолжить с Google</button><div id="authError" class="error"></div></div></div>
<div id="app" class="app hidden"><header class="topbar"><div class="brand"><span class="brand-dot"></span><b>Mail Agent</b></div><div class="top-actions"><button id="statusBtn">🟢 В сети</button><button id="logoutBtn">Выйти</button></div></header>
<main class="layout"><aside class="sidebar"><div class="profile"><div id="myAvatar" class="avatar">A</div><div><b id="myName">Пользователь</b><small id="myEmail"></small></div></div><input id="searchUsers" class="search" placeholder="🔎 Поиск пользователей..."><div class="tabs"><button id="tabFriends" class="tab active">Друзья</button><button id="tabUsers" class="tab">Люди</button><button id="tabRequests" class="tab">Заявки <span id="requestCount" class="badge hidden">0</span></button></div><div id="friendsList" class="users"></div><div id="usersList" class="users hidden"></div><div id="requestsList" class="requests hidden"></div></aside>
<section class="chat"><div id="emptyChat" class="empty"><div class="big-at">@</div><b>Выберите контакт</b><span>Общайтесь в реальном времени</span></div><div id="chatPanel" class="hidden full"><div class="chat-head"><div id="chatAvatar" class="avatar">A</div><div class="chat-title"><b id="chatName">Контакт</b><small id="chatStatus">offline</small><small id="typingIndicator" class="typing hidden">печатает...</small></div><button id="friendBtn" class="friend-btn">+ Добавить в друзья</button></div><div id="messages" class="messages"></div><div id="uploadProgress" class="upload-progress hidden"></div><form id="messageForm" class="composer"><input id="fileInput" type="file" hidden accept="image/*,.pdf,.txt,.doc,.docx,.zip"><button type="button" id="fileBtn" class="icon-btn">📎</button><button type="button" id="emojiBtn" class="icon-btn">😀</button><input id="messageInput" autocomplete="off" placeholder="Введите сообщение..."><button type="submit">➤</button></form><div id="emojiPanel" class="emoji-panel hidden"></div></div></section></main></div><script type="module" src="app.js"></script></body></html>
